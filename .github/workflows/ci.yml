name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm run test:cov
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Assert the core suite is still fast
        # The fast suite is a feature, not a nicety — it is what makes the
        # implement/test loop tight. Fail the build if it regresses past 10s.
        run: node scripts/assert-fast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
